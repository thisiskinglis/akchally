@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap');

:root{
  --bg:#F2EDE6;
  --fg:#0F0F0F;
  --orange:#FF3D12;
  --oxblood:#120605;
  --cream:#EDE3D3;
  --paper:#FFF8EC;
  --white:#FFFBF5;
  --gutter:2.5vw;
  --page-max:1440px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0}
.ak-root{
  background:var(--bg);
  color:var(--fg);
  font-family:'Space Grotesk',sans-serif;
  line-height:1.45;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Syne',sans-serif; text-transform:uppercase; line-height:.92; letter-spacing:-.03em}
.mono{font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; font-weight:700}
a{color:inherit; text-decoration:none}
.btn{
  display:inline-flex; align-items:center; gap:.7rem;
  border:1.5px solid var(--fg);
  padding:1rem 1.8rem;
  font-weight:700; font-size:.8rem;
  letter-spacing:.1em; text-transform:uppercase;
  transition:.2s; cursor:pointer; line-height:1;
}
.btn-black{background:var(--fg); color:var(--bg)}
.btn-black:hover{background:var(--orange); border-color:var(--orange); color:white; transform:translateY(-2px)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}

/* NAV */
nav{
  position:sticky; top:0; z-index:60;
  display:flex; justify-content:space-between; align-items:center;
  padding:1rem var(--gutter);
  background:rgba(15,15,15,.92);
  backdrop-filter:blur(12px);
  border-bottom:1.5px solid var(--fg);
  color:var(--bg);
}
.logo{font-family:'Syne',sans-serif; font-weight:800; font-size:1.9rem; letter-spacing:-.05em; text-transform:lowercase; color:var(--bg)}
.dot{width:.38em; height:.38em; background:var(--orange); border-radius:50%; display:inline-block; margin-left:.05em; vertical-align:baseline}
.nav-links{display:flex; gap:1.2rem; align-items:center}
.nav-links a{font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; font-weight:700; opacity:.65; color:var(--bg); transition:.2s}
.nav-links a:hover{opacity:1}
.hamburger{display:none; font-size:1.2rem; cursor:pointer}
@media(max-width:1000px){
  .nav-links{display:none}
  .hamburger{display:block}
}

/* HERO */
.hero{background:var(--paper); padding:5vw var(--gutter) 3vw; position:relative; overflow:hidden; border-bottom:1.5px solid var(--fg)}
.big-bg-text{
  position:absolute; top:-1vw; right:1vw;
  font-family:'Syne',sans-serif; font-weight:800;
  font-size:28vw; line-height:.8; opacity:.035; text-transform:uppercase; pointer-events:none; letter-spacing:-.06em;
}
.hero-top{display:grid; grid-template-columns:1.2fr .75fr; gap:4vw; position:relative}
.hero-left .mono{opacity:.7}
.hero-left h1{font-size:clamp(2.8rem,6.2vw,5.4rem); line-height:.84; max-width:12ch; margin-bottom:1.2rem}
.hero-left h1 i{font-family:'Instrument Serif',serif; font-style:italic; text-transform:none; font-weight:400; color:var(--orange); display:block}
.hero-copy{max-width:50ch; font-size:1.05rem; line-height:1.6; opacity:.9}
.hero-copy p{margin-bottom:.8rem}
.hero-actions{margin-top:2rem}
.hero-right{display:flex; align-items:start; justify-content:end; padding-top:2rem}
.hero-note{border:1.5px solid var(--fg); padding:1.2rem; background:var(--white); max-width:28ch; box-shadow:6px 6px 0 var(--fg)}
@media(max-width:900px){
  .hero-top{grid-template-columns:1fr}
  .hero-right{justify-content:start}
  .big-bg-text{font-size:42vw; top:4vw}
}

/* TWO KINDS */
.kinds-wrap{border-top:1.5px solid var(--fg); border-bottom:1.5px solid var(--fg); background:var(--white)}
.kinds-head{padding:2.2vw var(--gutter); border-bottom:1.5px solid var(--fg); display:flex; justify-content:space-between; align-items:end; gap:2rem; flex-wrap:wrap; background:var(--white)}
.kinds-head h2{font-size:clamp(1.6rem,3vw,2.6rem); line-height:.9}
.kinds-grid{display:grid; grid-template-columns:1fr 1fr}
.kind-card{padding:3vw var(--gutter); position:relative; display:flex; flex-direction:column}
.kind-card:first-child{border-right:1.5px solid var(--fg); background:var(--paper)}
.kind-card.kind-you{background:var(--fg); color:var(--bg)}
.mono-label{color:var(--orange); display:block; margin-bottom:1rem}
.kind-card h3{font-weight:800; font-size:clamp(1.5rem,2.8vw,2.4rem); line-height:.92; max-width:16ch; margin-bottom:1.2rem}
.kind-card h3 i{font-family:'Instrument Serif',serif; font-style:italic; text-transform:none; font-weight:400; color:var(--orange)}
.kind-list{list-style:none; margin:0 0 1.8rem; font-size:.82rem; line-height:1.6; opacity:.85}
.kind-list li::before{content:"→ "; color:var(--orange)}
.kind-card .btn{margin-top:auto; width:fit-content}
@media(max-width:800px){.kinds-grid{grid-template-columns:1fr}.kind-card:first-child{border-right:none; border-bottom:1.5px solid var(--fg)}}

/* POSITIONING INTERRUPT */
.pos-interrupt{border-bottom:1.5px solid var(--fg); background:var(--fg); color:var(--bg); position:relative; overflow:hidden}
.pos-interrupt::before{content:""; position:absolute; inset:0; background:radial-gradient(70% 70% at 20% 20%, rgba(255,61,18,.18), transparent), radial-gradient(60% 60% at 80% 80%, rgba(255,61,18,.12), transparent); pointer-events:none}
.pos-top{padding:4.5vw var(--gutter) 2.5vw; display:grid; grid-template-columns:.95fr 1.05fr; gap:4vw; position:relative; border-bottom:1px solid rgba(255,248,236,.12)}
.pos-big h2{font-weight:800; font-size:clamp(2.8rem,6.5vw,5.8rem); line-height:.84; letter-spacing:-.05em}
.pos-big h2 span{font-family:'Instrument Serif',serif; font-style:italic; text-transform:none; color:var(--orange); display:block; font-size:.88em; letter-spacing:-.02em; margin-top:.15em}
.pos-copy{padding-top:.6rem}
.pos-copy p{font-size:1rem; line-height:1.6; opacity:.88; margin-bottom:1rem}
.pos-copy p.lead{font-size:1.18rem; line-height:1.4; opacity:1; font-weight:500}
.pos-copy b{color:var(--bg); font-weight:700}
.pos-proof{margin-top:2rem; padding:1.2rem; border:1px solid rgba(255,248,236,.15); background:rgba(255,255,255,.03)}
.pos-proof .mono{opacity:.6; margin-bottom:.6rem; display:block}
.pos-proof p{font-size:.8rem; line-height:1.6; opacity:.7}
.pos-proof p b{color:var(--orange)}
.pos-package-wrap{padding:2.5vw var(--gutter) 3.5vw; position:relative; display:grid; grid-template-columns:1.1fr .9fr; gap:4vw; align-items:start}
.pos-package-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1.5px; background:rgba(255,248,236,.15); border:1.5px solid rgba(255,248,236,.15)}
.pos-package-grid > div{background:#121212; padding:1.8vw 1.5vw}
.pos-package-grid h4{font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; color:var(--orange); margin-bottom:.6rem}
.pos-package-grid p{font-size:.8rem; line-height:1.5; opacity:.8}
.pos-cta-box{border:1.5px solid var(--bg); padding:2vw; background:rgba(255,255,255,.02)}
.pos-cta-box .mono{opacity:.6}
.pos-price{font-family:'Instrument Serif',serif; font-size:clamp(2.8rem,4vw,4.2rem); line-height:.9; margin:.6rem 0 .4rem}
.pos-price small{font-family:'Syne',sans-serif; font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; opacity:.6; display:block; margin-bottom:.3rem}
.pos-cta-box ul{list-style:none; margin:1rem 0 1.5rem}
.pos-cta-box li{font-size:.82rem; padding:.35rem 0; border-bottom:1px solid rgba(255,248,236,.1); display:flex; gap:.5rem}
.pos-cta-box li::before{content:"—"; color:var(--orange)}
@media(max-width:950px){
  .pos-top, .pos-package-wrap{grid-template-columns:1fr}
  .pos-package-grid{grid-template-columns:1fr}
  .pos-package-grid > div{padding:5vw var(--gutter)}
}

/* SECTION HEADERS */
.sec-03-head{padding:2.2vw var(--gutter); display:flex; justify-content:space-between; align-items:end; gap:2rem; flex-wrap:wrap; background:var(--white); border-bottom:1.5px solid var(--fg)}
.sec-03-head h2{font-size:clamp(1.8rem,3.2vw,3rem)}

/* PRICING */
.pricing{background:var(--cream); border-bottom:1.5px solid var(--fg); padding:3vw var(--gutter)}
.pricing-grid{display:grid; gap:1.5px; background:var(--fg); border:1.5px solid var(--fg)}
.pricing-grid.tight-3{grid-template-columns:repeat(3,1fr)}
.pricing-grid.tight-5{grid-template-columns:repeat(5,1fr)}
.price-card{background:var(--paper); padding:2.2vw; display:flex; flex-direction:column; position:relative; overflow:hidden}
.price-card h4{font-size:1rem; margin-bottom:.5rem; line-height:1.2}
.from{font-family:'Instrument Serif',serif; font-style:italic; font-size:1.6rem; margin-bottom:1rem}
@media(max-width:1100px){
  .pricing-grid.tight-3{grid-template-columns:repeat(2,1fr)}
  .pricing-grid.tight-5{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
  .pricing-grid.tight-3,.pricing-grid.tight-5{grid-template-columns:1fr}
}

/* DOC TYPES */
.doc-types{display:grid; grid-template-columns:repeat(3,1fr); border-top:1.5px solid var(--fg); border-bottom:1.5px solid var(--fg)}
.doc-types > div{padding:2.2vw var(--gutter); border-right:1.5px solid var(--fg)}
.doc-types > div:nth-child(3n){border-right:none}
.doc-types > div:nth-child(n+4){border-top:1.5px solid var(--fg)}
.doc-types h4{font-size:.9rem; text-transform:uppercase; margin-bottom:.6rem}
.doc-types p{font-size:.76rem; opacity:.85; line-height:1.6}
@media(max-width:800px){.doc-types{grid-template-columns:1fr}.doc-types > div{border-right:none; border-bottom:1.5px solid var(--fg)}.doc-types > div:nth-child(n+4){border-top:none}}

/* PHILO */
.philo{background:var(--white); padding:5vw var(--gutter); border-bottom:1.5px solid var(--fg)}
.do-grid{display:grid; grid-template-columns:repeat(4,1fr); border-top:1.5px solid var(--fg); border-bottom:1.5px solid var(--fg)}
.do-grid > div{padding:2vw var(--gutter); border-right:1.5px solid var(--fg)}
.do-grid > div:last-child{border-right:none}
.do-grid h4{font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--orange); margin-bottom:.6rem}
.do-grid p{font-size:.75rem; line-height:1.5}
@media(max-width:900px){.do-grid{grid-template-columns:repeat(2,1fr)}.do-grid > div:nth-child(even){border-right:none}.do-grid > div:nth-child(n+3){border-top:1.5px solid var(--fg)}}

/* SEC-02 */
.sec-02{display:grid; grid-template-columns:.85fr 1.15fr; gap:4vw; padding:4vw var(--gutter); border-bottom:1.5px solid var(--fg); background:var(--paper)}
.sec-02-left h2{font-size:clamp(2rem,4vw,3.8rem)}
.sec-02-right p{margin-bottom:.9rem; line-height:1.6}
@media(max-width:850px){.sec-02{grid-template-columns:1fr}}

/* HOW */
.how-head{padding:2vw var(--gutter); display:flex; justify-content:space-between; border-bottom:1.5px solid var(--fg); background:var(--white)}
.steps{display:grid; grid-template-columns:repeat(5,1fr); border-bottom:1.5px solid var(--fg); background:var(--white)}
.split-num{font-family:'Instrument Serif',serif; font-size:3rem; color:var(--orange); line-height:1}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}.steps > div{border-bottom:1.5px solid var(--fg)}}
@media(max-width:600px){.steps{grid-template-columns:1fr}}

/* FINAL */
.final{background:var(--paper); padding:6vw var(--gutter); display:grid; grid-template-columns:1fr 1fr; gap:4vw; border-bottom:1.5px solid var(--fg)}
.final h2{font-size:clamp(2.8rem,6vw,5.2rem)}
.final h2 i{color:var(--orange); font-family:'Instrument Serif',serif; font-style:italic; text-transform:none; display:block}
.final-right p{line-height:1.5; margin-bottom:.5rem}
@media(max-width:900px){.final{grid-template-columns:1fr}}

/* FOOTER */
footer{padding:2.5vw var(--gutter); display:grid; grid-template-columns:1.2fr .6fr .6fr; gap:3vw; background:var(--white); font-size:.75rem; border-top:1.5px solid var(--fg)}
.foot-logo{font-family:'Syne',sans-serif; font-weight:800; font-size:1.6rem; letter-spacing:-.04em; text-transform:lowercase}
.foot-logo span{color:var(--orange)}
footer a{display:block; margin:.3rem 0; opacity:.7; text-transform:uppercase; letter-spacing:.08em; font-size:.72rem}
footer a:hover{opacity:1; color:var(--orange)}
.foot-bottom{grid-column:1/-1; border-top:1.5px solid var(--fg); margin-top:1vw; padding-top:1rem; display:flex; justify-content:space-between; opacity:.5; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; flex-wrap:wrap; gap:1rem}
@media(max-width:800px){footer{grid-template-columns:1fr}}
